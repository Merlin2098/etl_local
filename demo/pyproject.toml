[project]
name = "generador-demo"
version = "0.1.0"
description = "Generador de data sintética (Excel con layout legacy) para la demo y los tests del ETL de RR. HH."
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1",
    "faker>=30",
]

[project.scripts]
generar-demo = "generador_demo.cli:main"
generar-golden = "paridad_legacy.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
# Versiones exactas del uv.lock del legacy, para ejecutarlo tal como corría (Plan 2).
paridad = [
    "polars==1.40.1",
    "duckdb==1.5.2",
    "openpyxl==3.1.5",
    "pyyaml==6.0.3",
    "pyside6==6.11.0",
    "fastexcel==0.20.2",
    "xlsxwriter==3.2.9",
    "pyarrow==23.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/generador_demo", "src/paridad_legacy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["paridad: ejecuta el proyecto legacy (se omite si no está disponible)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
